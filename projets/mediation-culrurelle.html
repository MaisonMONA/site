<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médiation culturelle</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <div id="header"></div>

    <main>
        <h1>Médiation culturelle</h1>
    </main>

    <div id="footer"></div>

    <script>
        fetch('../header.html')
            .then(res => res.text())
            .then(data => document.getElementById('header').innerHTML = data);

        fetch('../footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer').innerHTML = data);
    </script>

</body>
</html>
