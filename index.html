<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison MONA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header"></div>

    <main>
        <h1>La ville devient votre terrain de jeu</h1>
       <div class="mockups">
           <img src="img/Application/mockups/MONA_mockups_fiche.png" alt="Mockup fiche">
           <img src="img/Application/mockups/MONA_mockups_carte.png" alt="Mockup carte">
           <img src="img/Application/mockups/MONA_mockups_collection.png" alt="Mockup collection">
       </div>
            <p class="chapo">MONA est une application mobile gratuite qui invite à la découverte de l'art et des lieux culturels au Québec.</p>
            <p class="sous-chapo">Recherchez des œuvres d'art et prenez-les en photo pour les ajouter à votre collection personnelle.</p>
    </main>

    <div id="footer"></div>

    <script>
        fetch('header.html')
            .then(res => res.text())
            .then(data => document.getElementById('header').innerHTML = data);

        fetch('footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer').innerHTML = data);
    </script>

</body>
</html>
